<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Nuevo producto | Manzanita Store
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4">
        Registrar producto
    </h2>

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Nombre
            </label>

            <input
                type="text"
                name="nombre"
                class="form-control"
                required
            >

        </div>

        <div class="mb-3">

            <label class="form-label">
                Descripción
            </label>

            <input
                type="text"
                name="descripcion"
                class="form-control"
            >

        </div>

        <div class="mb-3">

            <label class="form-label">
                Precio
            </label>

            <input
                type="number"
                step="0.01"
                name="precio"
                class="form-control"
                required
            >

        </div>

        <div class="mb-3">

            <label class="form-label">
                Stock
            </label>

            <input
                type="number"
                name="stock"
                class="form-control"
                min="0"
                required
            >

        </div>

        <div class="mb-3">

            <label class="form-label">
                Stock mínimo
            </label>

            <input
                type="number"
                name="stock_minimo"
                class="form-control"
                min="0"
                value="5"
                required
            >

        </div>

        <button
            type="submit"
            class="btn btn-success"
        >
            Guardar producto
        </button>

        <a
            href="{{ url_for('inventario.lista') }}"
            class="btn btn-secondary"
        >
            Cancelar
        </a>

    </form>

</div>

</body>
</html>
