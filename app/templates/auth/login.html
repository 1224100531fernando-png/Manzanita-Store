<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio de sesión - Manzanita Store</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <h1>Manzanita Store</h1>

            <h2>Inicio de sesión</h2>

            {% if error %}
                <p class="error">
                    {{ error }}
                </p>
            {% endif %}

            <form method="POST">

                <label for="usuario">
                    Usuario
                </label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Ingresa tu usuario"
                    required
                >

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    required
                >

                <button type="submit">
                    Iniciar sesión
                </button>

            </form>

        </section>

    </main>

</body>

</html>
